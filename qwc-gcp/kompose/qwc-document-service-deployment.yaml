apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: qwc-document-service
  name: qwc-document-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: qwc-document-service
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: qwc-document-service
    spec:
      containers:
        - env:
            - name: JWT_COOKIE_CSRF_PROTECT
              value: "True"
            - name: JWT_COOKIE_SAMESITE
              value: Strict
            - name: JWT_SECRET_KEY
              value: d9532b1f681d5f40afa49f7cfbceaf5f4bf3eb879d12cb12889c30648f714ac148a1c73967edf001b83f6b0c9f705cd8
            - name: SERVICE_MOUNTPOINT
              value: /api/v1/document
          image: sourcepole/qwc-document-service:latest-2025-lts
          name: qwc-document-service
          volumeMounts:
            - mountPath: /srv/pg_service.conf
              name: atlas-qwc-db-config
              readOnly: true
              subPath: pg_service.conf
            - mountPath: /reports
              name: atlas-qwc-report-config
            - mountPath: /srv/qwc_service/fonts
              name: atlas-qwc-volume-read-write-once
            - mountPath: /srv/qwc_service/config
              name: atlas-qwc-folder-config
              readOnly: true
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: pg_service.conf
                path: pg_service.conf
            name: atlas-qwc-db-config
          name: atlas-qwc-db-config
        - configMap:
            name: atlas-qwc-report-config
          name: atlas-qwc-report-config
        - name: atlas-qwc-volume-read-write-once
          persistentVolumeClaim:
            claimName: atlas-qwc-volume-read-write-once
        - configMap:
            name: atlas-qwc-folder-config
          name: atlas-qwc-folder-config

