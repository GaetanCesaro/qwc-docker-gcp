apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: qwc-api-gateway
  name: qwc-api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: qwc-api-gateway
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: qwc-api-gateway
    spec:
      containers:
        - image: nginx:1.27
          name: qwc-api-gateway
          ports:
            - containerPort: 80
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/nginx/conf.d/default.conf
              name: qwc-api-gateway-cm0
              readOnly: true
              subPath: default.conf
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: nginx.conf
                path: default.conf
            name: qwc-api-gateway-cm0
          name: qwc-api-gateway-cm0
