apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: qwc-qgis-server
  name: qwc-qgis-server
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: qwc-qgis-server
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: qwc-qgis-server
    spec:
      containers:
        - env:
            - name: FCGID_EXTRA_ENV
              value: PRINT_LAYOUT_DIR
            - name: PRINT_LAYOUT_DIR
              value: /layouts
            - name: QGIS_SERVER_CACHE_DIRECTORY
              value: /tmp/qgis-cache
            - name: QGIS_SERVER_CACHE_SIZE
              value: "100"
            - name: QGIS_SERVER_PARALLEL_RENDERING
              value: "1"
          image: sourcepole/qwc-qgis-server:3.40
          name: qwc-qgis-server
          volumeMounts:
            - mountPath: /data
              name: qwc-qgis-server-cm0
              readOnly: true
            - mountPath: /etc/postgresql-common/pg_service.conf
              name: qwc-qgis-server-cm1
              readOnly: true
              subPath: pg_service.conf
            - mountPath: /usr/share/qgis/python/plugins/print_templates
              name: qwc-qgis-server-claim2
              readOnly: true
            - mountPath: /usr/share/qgis/python/plugins/split_categorized
              name: qwc-qgis-server-claim3
              readOnly: true
            - mountPath: /usr/share/qgis/python/plugins/filter_geom
              name: qwc-qgis-server-claim4
              readOnly: true
            - mountPath: /usr/share/qgis/python/plugins/clear_capabilities
              name: qwc-qgis-server-claim5
              readOnly: true
            - mountPath: /layouts
              name: qwc-qgis-server-cm6
              readOnly: true
      restartPolicy: Always
      volumes:
        - configMap:
            name: qwc-qgis-server-cm0
          name: qwc-qgis-server-cm0
        - configMap:
            items:
              - key: pg_service.conf
                path: pg_service.conf
            name: qwc-qgis-server-cm1
          name: qwc-qgis-server-cm1
        - name: qwc-qgis-server-claim2
          persistentVolumeClaim:
            claimName: qwc-qgis-server-claim2
            readOnly: true
        - name: qwc-qgis-server-claim3
          persistentVolumeClaim:
            claimName: qwc-qgis-server-claim3
            readOnly: true
        - name: qwc-qgis-server-claim4
          persistentVolumeClaim:
            claimName: qwc-qgis-server-claim4
            readOnly: true
        - name: qwc-qgis-server-claim5
          persistentVolumeClaim:
            claimName: qwc-qgis-server-claim5
            readOnly: true
        - configMap:
            name: qwc-qgis-server-cm6
          name: qwc-qgis-server-cm6
